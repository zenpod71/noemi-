<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Chuva de TE AMO ♡</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      font-family: 'Segoe UI', sans-serif;
    }
    canvas { display: block; }

    .floating-text {
      position: absolute;
      color: #00ddff;
      font-size: 38px;
      font-weight: bold;
      pointer-events: none;
      text-shadow: 0 0 20px #00ddff, 0 0 40px #0088ff;
      animation: floatUp 3s ease-out forwards;
      user-select: none;
    }
    @keyframes floatUp {
      0%   { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-200px) scale(1.6); }
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    let w = canvas.width = window.innerWidth;
    let h = canvas.height = window.innerHeight;

    const phrase = "TE AMO";                    // sem espaço no final
    const fontSize = 28;                        // tamanho bom e legível
    const spacingX = fontSize * 4.2;            // espaçamento horizontal grande
    let columns = Math.floor(w / spacingX) + 2;
    let drops = Array(columns).fill(-150);

    let lastTime = 0;
    const frameDelay = 150;                     // velocidade gostosa e legível

    function draw(timestamp) {
      if (!lastTime) lastTime = timestamp;
      if (timestamp - lastTime < frameDelay) {
        requestAnimationFrame(draw);
        return;
      }
      lastTime = timestamp;

      // fundo preto com fade suave
      ctx.fillStyle = "rgba(0, 0, 0, 0.06)";
      ctx.fillRect(0, 0, w, h);

      ctx.font = `bold ${fontSize}px 'Segoe UI', Arial`;

      for (let i = 0; i < drops.length; i++) {
        const x = i * spacingX + 30;
        const y = drops[i] * fontSize * 1.3;   // espaçamento vertical também generoso

        // Cabeça branca brilhante
        ctx.fillStyle = "#ffffff";
        ctx.shadowBlur = 25;
        ctx.shadowColor = "#ffffff";
        ctx.fillText(phrase, x, y);

        // Próxima letra azul forte
        ctx.fillStyle = "#00ddff";
        ctx.shadowBlur = 18;
        ctx.shadowColor = "#00ddff";
        ctx.fillText(phrase, x, y + fontSize * 1.3);

        // Rastro azul claro (poucos e espaçados)
        ctx.fillStyle = "#0088ff";
        ctx.globalAlpha = 0.6;
        for (let j = 2; j < 6; j++) {
          const trailY = y + j * fontSize * 1.5;
          if (trailY < h + 100) {
            ctx.globalAlpha = 0.6 - j * 0.1;
            ctx.fillText(phrase, x, trailY);
          }
        }
        ctx.globalAlpha = 1;

        drops[i] += 0.55;

        if (y > h + 100) {
          drops[i] = -Math.random() * 180 - 50;
        }
      }

      requestAnimationFrame(draw);
    }

    requestAnimationFrame(draw);

    // redimensionar
    window.addEventListener('resize', () => {
      w = canvas.width = window.innerWidth;
      h = canvas.height = window.innerHeight;
      columns = Math.floor(w / spacingX) + 2;
      drops = Array(columns).fill(-150);
    });

    // clique → TE AMO grande azul subindo lindo
    document.addEventListener('click', (e) => {
      const el = document.createElement('div');
      el.className = 'floating-text';
      el.innerText = 'TE AMO';
      el.style.left = (e.clientX - 90) + 'px';
      el.style.top = (e.clientY - 40) + 'px';
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 3200);
    });
  </script>
</body>
</html>
