<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Chuva de TE AMO ♡</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      font-family: 'Segoe UI', sans-serif;
    }
    canvas { display: block; }

    .floating-text {
      POSITION: absolute;
      color: #00ffff;
      font-size: 44px;
      font-weight: bold;
      pointer-events: none;
      animation: floatUp 3s ease-out forwards;
      text-shadow: 
        0 0 10px #00ffff,
        0 0 20px #00ffff,
        0 0 40px #00ffff,
        0 0 80px #0066ff;
      user-select: none;
    }
    @keyframes floatUp {
      0%   { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      100% { opacity: 0; transform: translate(-50%, -220px) scale(2.2); }
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    const phrase = "TE AMO ";
    const fontSize = 18;
    const columnSpacing = fontSize * 3.8;
    let columns = Math.floor(width / columnSpacing) + 1;
    let drops = Array(columns).fill(-Math.random() * 100);

    function draw() {
      // Fundo COMPLETAMENTE preto a cada frame (sem rastro)
      ctx.fillStyle = "#000000";
      ctx.fillRect(0, 0, width, height);

      // Gradiente azul neon puro
      const gradient = ctx.createLinearGradient(0, 0, width, height);
      gradient.addColorStop(0,   "#00f0ff");
      gradient.addColorStop(0.5, "#0088ff");
      gradient.addColorStop(1,   "#0088ff");

      ctx.font = `bold ${fontSize}px 'Segoe UI', Arial`;

      for (let i = 0; i < drops.length; i++) {
        const x = i * columnSpacing + 20;
        const y = drops[i] * fontSize * 1.6;

        // Cabeça brilhante (branco com glow ciano)
        ctx.fillStyle = "#ffffff";
        ctx.shadowBlur = 20;
        ctx.shadowColor = "#00ffff";
        ctx.fillText(phrase, x, y);

        // Corpo em azul neon
        ctx.fillStyle = gradient;
        ctx.shadowBlur = 12;
        ctx.shadowColor = "#00ffff";
        if (drops[i] > 0) {
          ctx.fillText(phrase, x, y - fontSize * 1.6);
        }

        drops[i] += 0.7;
        if (y > height + 50) {
          drops[i] = -Math.random() * 120;
        }
      }
      requestAnimationFrame(draw);
    }

    requestAnimationFrame(draw);

    // Redimensionamento
    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      columns = Math.floor(width / columnSpacing) + 1;
      drops = Array(columns).fill(-Math.random() * 100);
    });

    // Clique = TE AMO grande azul neon
    document.addEventListener('click', (e) => {
      const text = document.createElement('div');
      text.className = 'floating-text';
      text.innerText = 'TE AMO ♡';
      text.style.left = e.clientX + 'px';
      text.style.top = e.clientY + 'px';
      document.body.appendChild(text);
      setTimeout(() => text.remove(), 3200);
    });
  </script>
</body>
</html>
