<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Chuva de TE AMO</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      font-family: 'Segoe UI', sans-serif;
    }
    canvas { display: block; }
    .floating-text {
      position: absolute;
      color: #00ffff;
      font-size: 44px;
      font-weight: bold;
      pointer-events: none;
      animation: floatUp 3s ease-out forwards;
      text-shadow:
        0 0 10px #00ffff,
        0 0 20px #00ffff,
        0 0 40px #00ffff,
        0 0 80px #0066ff;
      user-select: none;
    }
    @keyframes floatUp {
      0%   { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      100% { opacity: 0; transform: translate(-50%, -220px) scale(2.2); }
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;
    const phrase = "TE AMO ";           // texto correto
    const fontSize = 18;
    const columnSpacing = fontSize * 3.8;
    let columns = Math.floor(width / columnSpacing) + 1;
    let drops = Array(columns).fill(-Math.random() * 100);

    function draw() {
      // Fundo 100% preto a cada frame
      ctx.fillStyle = "#000000";
      ctx.fillRect(0, 0, width, height);

      // Gradiente azul neon
      const gradient = ctx.createLinearGradient(0, 0, width, height);
      gradient.addColorStop(0,   "#00f0ff");
      gradient.addColorStop(0.5, "#0088ff");
      gradient.addColorStop(1,   "#0066cc");

      ctx.font = `bold ${fontSize}px 'Segoe UI', Arial`;

      for (let i = 0; i < drops.length; i++) {
        const x = i * columnSpacing + 20;
        const y = drops[i] * fontSize * 1.6;

        // Cabeça brilhante branca
        ctx.fillStyle = "#ffffff";
        ctx.shadowBlur = 22;
        ctx.shadowColor = "#00ffff";
        ctx.fillText(phrase, x, y);

        // Rastro de 4 “TE AMO” atrás (muito mais cheio)
        ctx.fillStyle = gradient;
        ctx.shadowBlur = 14;
        ctx.shadowColor = "#00ffff";
        for (let t = 1; t <= 4; t++) {
          if (drops[i] >= t) {
            ctx.globalAlpha = 1 - t * 0.18;
            ctx.fillText(phrase, x, y - t * fontSize * 1.6);
          }
        }
        ctx.globalAlpha = 1;

        drops[i] += 0.96;   // velocidade perfeita (rápida e legível)

        if (y > height + 80) {
          drops[i] = -Math.random() * 140;
        }
      }
      requestAnimationFrame(draw);
    }

    requestAnimationFrame(draw);

    // Redimensionamento
    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      columns = Math.floor(width / columnSpacing) + 1;
      drops = Array(columns).fill(-Math.random() * 100);
    });

    // Clique cria TE AMO grande subindo
    document.addEventListener('click', (e) => {
      const text = document.createElement('div');
      text.className = 'floating-text';
      text.innerText = 'TE AMO';
      text.style.left = e.clientX + 'px';
      text.style.top = e.clientY + 'px';
      document.body.appendChild(text);
      setTimeout(() => text.remove(), 3200);
    });
  </script>
</body>
</html>
