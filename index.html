<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Chuva de TE AMO ♡</title>
  <style>
    body { margin: 0; overflow: hidden; background: #000; }
    canvas { display: block; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    // Ajusta o tamanho
    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    const phrase = "TE AMO";
    const fontSize = 32;                    // tamanho bom e legível
    const columnSpacing = fontSize * 3.2;    // espaçamento horizontal grande (era muito colado)
    const columns = Math.floor(canvas.width / columnSpacing) + 1;
    const drops = new Array(columns).fill(-50); // começa um pouco acima pra não aparecer tudo de uma vez

    // Controle de velocidade bem lenta
    let lastTime = 0;
    const frameDelay = 280; // quase 3–4 quadros por segundo → super tranquilo de ler

    function draw(timestamp) {
      if (!lastTime) lastTime = timestamp;
      if (timestamp - lastTime < frameDelay) {
        requestAnimationFrame(draw);
        return;
      }
      lastTime = timestamp;

      // Fundo preto puro com fade bem suave (mantém limpo)
      ctx.fillStyle = "rgba(0, 0, 0, 0.06)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.font = `bold ${fontSize}px 'Segoe UI', Arial`;
      ctx.shadowBlur = 15;
      ctx.shadowColor = "#00f0ff";

      for (let i = 0; i < drops.length; i++) {
        const x = i * columnSpacing + 20;
        const y = drops[i] * fontSize * 1.1; // espaçamento vertical também aumentado

        // Cabeça da coluna (branca)
        ctx.fillStyle = "#ffffff";
        ctx.fillText(phrase, x, y);

        // Corpo da coluna (azul neon)
        ctx.fillStyle = "#00f0ff";
        if (drops[i] > 0) {
          ctx.fillText(phrase, x, y - fontSize * 1.1);
        }

        // Avança devagar
        drops[i] += 0.35;

        // Reinicia a coluna com espaçamento aleatório
        if (y > canvas.height + 100) {
          drops[i] = -Math.random() * 80; // começa em alturas diferentes
        }
      }

      requestAnimationFrame(draw);
    }

    requestAnimationFrame(draw);
  </script>
</body>
</html>
