<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Lluvia de TE AMO</title>
  <style>
    body { margin: 0; overflow: hidden; background:#000; font-family:'Segoe UI',sans-serif; }
    canvas { display:block; }
    .floating-text {
      position:absolute; color:#00ffff; font-size:48px; font-weight:bold;
      pointer-events:none; animation:floatUp 3s ease-out forwards;
      text-shadow:0 0 10px #00ffff,0 0 20px #00ffff,0 0 40px #00ffff,0 0 80px #0066ff;
      user-select:none;
    }
    @keyframes floatUp { to { opacity:0; transform:translate(-50%,-280px) scale(2.5); } }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <!-- Música (sem controles, invisível) -->
  <audio id="musica" loop preload="auto">
    <source src="sofia.mp4" type="video/mp4">
  </audio>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let w = canvas.width = window.innerWidth;
    let h = canvas.height = window.innerHeight;

    const phrase = "TE AMO ";
    const fontSize = 20;
    const colSpace = fontSize * 2.3;
    let cols = Math.floor(w / colSpace) + 10;
    let drops = [];
    for(let i=0; i<cols; i++) drops[i] = Math.random() * -300;

    const audio = document.getElementById('musica');
    audio.volume = 0.6;

    // TRUQUE 2025: desbloqueia o áudio com um "click silencioso" invisível
    const unlockAudio = () => {
      audio.play().catch(()=>{});
      document.body.removeEventListener('click', unlockAudio);
      document.body.removeEventListener('touchstart', unlockAudio);
      document.body.removeEventListener('keydown', unlockAudio);
    };
    document.body.addEventListener('click', unlockAudio, {once:true});
    document.body.addEventListener('touchstart', unlockAudio, {once:true});
    document.body.addEventListener('keydown', unlockAudio, {once:true});

    // Tenta tocar imediatamente (funciona em muitos PCs e alguns Android)
    audio.play().catch(()=>{});

    // CHUVA DE TE AMO
    (function loop(){
      ctx.fillStyle = "#000";
      ctx.fillRect(0,0,w,h);

      const grad = ctx.createLinearGradient(0,0,w,h);
      grad.addColorStop(0,"#00ffff");
      grad.addColorStop(0.5,"#0088ff");
      grad.addColorStop(1,"#0044cc");

      ctx.font = `bold ${fontSize}px 'Segoe UI',Arial`;

      for(let i=0; i<drops.length; i++){
        const x = i*colSpace + 15;
        const y = drops[i]*fontSize*1.5;

        ctx.fillStyle = "#ffffff";
        ctx.shadowBlur = 25;
        ctx.shadowColor = "#00ffff";
        ctx.fillText(phrase, x, y);

        ctx.fillStyle = grad;
        ctx.shadowBlur = 15;
        ctx.shadowColor = "#00ffff";
        for(let t=1; t<=5; t++){
          if(drops[i]>t){
            ctx.globalAlpha = 1-t*0.16;
            ctx.fillText(phrase, x, y-t*fontSize*1.5);
          }
        }
        ctx.globalAlpha = 1;

        drops[i] += 1.05;
        if(y > h+100) drops[i] = -Math.random()*100;
      }
      requestAnimationFrame(loop);
    })();

    // Resize
    window.addEventListener('resize', ()=>{
      w = canvas.width = window.innerWidth;
      h = canvas.height = window.innerHeight;
      cols = Math.floor(w/colSpace)+10;
      drops = [];
      for(let i=0; i<cols; i++) drops[i] = Math.random()*-300;
    });

    // Clique = TE AMO grande
    document.addEventListener('click', e=>{
      const div = document.createElement('div');
      div.className = 'floating-text';
      div.textContent = 'TE AMO, SOFIA';
      div.style.left = e.clientX+'px';
      div.style.top = e.clientY+'px';
      document.body.appendChild(div);
      setTimeout(()=>div.remove(),3100);
    });
  </script>
</body>
</html>
