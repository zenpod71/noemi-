<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Chuva de TE AMO ♡</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      font-family: 'Segoe UI', sans-serif;
    }
    canvas { display: block; }

    /* Efeito de clique - TE AMO flutuante (do código antigo, mas mais bonito) */
    .floating-text {
      position: absolute;
      color: #ff3366;
      font-size: 36px;
      font-weight: bold;
      pointer-events: none;
      animation: floatUp 2.8s ease-out forwards;
      text-shadow: 0 0 15px #ff6699, 0 0 30px #ff0066;
      user-select: none;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
    }
    @keyframes floatUp {
      0%   { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      100% { opacity: 0; transform: translate(-50%, -180px) scale(1.8); }
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    const phrase = "TE AMO ";
    const fontSize = 18;                               // fonte original
    const columnSpacing = fontSize * 3.8;              // bem espaçado (novo)
    let columns = Math.floor(width / columnSpacing) + 1;
    let drops = Array(columns).fill(-Math.random() * 100);

    // Velocidade do código antigo (mas com controle suave)
    let lastTime = 0;
    const frameDelay = 110;  // velocidade original (rápida o suficiente, mas legível com espaçamento)

    function draw(timestamp) {
      if (!lastTime) lastTime = timestamp;
      if (timestamp - lastTime < frameDelay) {
        requestAnimationFrame(draw);
        return;
      }
      lastTime = timestamp;

      // Fundo com fade suave (novo - fica limpo)
      ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
      ctx.fillRect(0, 0, width, height);

      // Gradiente rosa lindo do código antigo
      const gradient = ctx.createLinearGradient(0, 0, width, height);
      gradient.addColorStop(0, "#ff4d6d");
      gradient.addColorStop(0.5, "#ff99aa");
      gradient.addColorStop(1, "#ff1a66");
      ctx.fillStyle = gradient;

      ctx.font = `bold ${fontSize}px 'Segoe UI', Arial`;
      ctx.shadowBlur = 10;
      ctx.shadowColor = "#ff6699";

      for (let i = 0; i < drops.length; i++) {
        const x = i * columnSpacing + 20;
        const y = drops[i] * fontSize * 1.6;  // espaçamento vertical generoso

        // Cabeça branca brilhante
        ctx.fillStyle = "#ffffff";
        ctx.shadowColor = "#ffffff";
        ctx.shadowBlur = 20;
        ctx.fillText(phrase, x, y);

        // Corpo rosa com gradiente
        ctx.fillStyle = gradient;
        ctx.shadowColor = "#ff6699";
        ctx.shadowBlur = 10;
        if (drops[i] > 0) {
          ctx.fillText(phrase, x, y - fontSize * 1.6);
        }

        drops[i] += 0.7;

        if (y > height + 100) {
          drops[i] = -Math.random() * 120;
        }
      }

      requestAnimationFrame(draw);
    }

    requestAnimationFrame(draw);

    // Redimensionamento perfeito
    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      columns = Math.floor(width / columnSpacing) + 1;
      drops = Array(columns).fill(-Math.random() * 100);
    });

    // Clique = TE AMO grande e flutuante (melhorado)
    document.addEventListener('click', (e) => {
      const text = document.createElement('div');
      text.className = 'floating-text';
      text.innerText = 'TE AMO ♡';
      text.style.left = e.clientX + 'px';
      text.style.top = e.clientY + 'px';
      document.body.appendChild(text);
      setTimeout(() => text.remove(), 3000);
    });
  </script>
</body>
</html>
