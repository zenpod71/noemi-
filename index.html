<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Lluvia de TE AMO</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: black;
      font-family: 'Segoe UI', sans-serif;
    }
    canvas { display: block; }

    .floating-text {
      position: absolute;
      color: #00ffff;
      font-size: 48px;
      font-weight: bold;
      pointer-events: none;
      animation: floatUp 3s ease-out forwards;
      text-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff, 0 0 40px #00ffff, 0 0 80px #0066ff;
      user-select: none;
    }
    @keyframes floatUp {
      to { opacity: 0; transform: translate(-50%, -280px) scale(2.5); }
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <!-- Música que começa automaticamente -->
  <audio autoplay loop id="musicaFondo" preload="auto">
    <source src="noemi.mp4" type="video/mp4">
    Tu navegador no soporta audio.
  </audio>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    const phrase = "TE AMO ";
    const fontSize = 20;
    const columnSpacing = fontSize * 2.3;
    let columns = Math.floor(width / columnSpacing) + 10;
    let drops = [];

    for (let i = 0; i < columns; i++) {
      drops[i] = Math.random() * -300;
    }

    // Forzar autoplay incluso en móviles
    const musica = document.getElementById('musicaFondo');
    musica.volume = 0.6;
    document.addEventListener('touchstart', () => musica.play(), { once: true });
    document.addEventListener('click', () => musica.play(), { once: true });

    function draw() {
      ctx.fillStyle = "#000";
      ctx.fillRect(0, 0, width, height);

      const gradient = ctx.createLinearGradient(0, 0, width, height);
      gradient.addColorStop(0,   "#00ffff");
      gradient.addColorStop(0.5, "#0088ff");
      gradient.addColorStop(1,   "#0044cc");

      ctx.font = `bold ${fontSize}px 'Segoe UI', Arial`;

      for (let i = 0; i < drops.length; i++) {
        const x = i * columnSpacing + 15;
        const y = drops[i] * fontSize * 1.5;

        ctx.fillStyle = "#ffffff";
        ctx.shadowBlur = 25;
        ctx.shadowColor = "#00ffff";
        ctx.fillText(phrase, x, y);

        ctx.fillStyle = gradient;
        ctx.shadowBlur = 15;
        ctx.shadowColor = "#00ffff";
        for (let t = 1; t <= 5; t++) {
          if (drops[i] > t) {
            ctx.globalAlpha = 1 - t * 0.16;
            ctx.fillText(phrase, x, y - t * fontSize * 1.5);
          }
        }
        ctx.globalAlpha = 1;

        drops[i] += 1.05;
        if (y > height + 100) drops[i] = -Math.random() * 100;
      }
      requestAnimationFrame(draw);
    }

    requestAnimationFrame(draw);

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      columns = Math.floor(width / columnSpacing) + 10;
      drops = [];
      for (let i = 0; i < columns; i++) drops[i] = Math.random() * -300;
    });

    document.addEventListener('click', (e) => {
      const text = document.createElement('div');
      text.className = 'floating-text';
      text.innerText = 'TE AMO';
      text.style.left = e.clientX + 'px';
      text.style.top = e.clientY + 'px';
      document.body.appendChild(text);
      setTimeout(() => text.remove(), 3100);
    });
  </script>
</body>
</html>
