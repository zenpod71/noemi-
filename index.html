<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Chuva de TE AMO</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      font-family: 'Segoe UI', sans-serif;
    }
    canvas { display: block; }

    .floating-text {
      position: absolute;
      color: #00ffff;
      font-size: 48px;
      font-weight: bold;
      pointer-events: none;
      animation: floatUp 3s ease-out forwards;
      text-shadow:
        0 0 10px #00ffff,
        0 0 20px #00ffff,
        0 0 40px #00ffff,
        0 0 80px #0066ff;
      user-select: none;
    }
    @keyframes floatUp {
      0%   { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      100% { opacity: 0; transform: translate(-50%, -250px) scale(2.4); }
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    const phrase = "TE AMO ";
    const fontSize = 20;
    const columnSpacing = fontSize * 2.1;   // bem denso
    let columns = Math.floor(width / columnSpacing) + 5;
    let drops = Array(columns).fill(0);

    // começa já cheio de TE AMO na tela
    for (let i = 0; i < drops.length; i++) {
      drops[i] = Math.random() * -200;
    }

    function draw() {
      ctx.fillStyle = "rgba(0, 0, 0, 0.04)";
      ctx.fillRect(0, 0, width, height);

      const gradient = ctx.createLinearGradient(0, 0, width, height);
      gradient.addColorStop(0,   "#00f0ff");
      gradient.addColorStop(0.5, "#0088ff");
      gradient.addColorStop(1,   "#0044cc");

      ctx.font = `bold ${fontSize}px 'Segoe UI', Arial`;

      for (let i = 0; i < drops.length; i++) {
        const x = i * columnSpacing + 15;
        const y = drops[i] * fontSize * 1.5;

        // cabeça brilhante
        ctx.fillStyle = "#ffffff";
        ctx.shadowBlur = 25;
        ctx.shadowColor = "#00ffff";
        ctx.fillText(phrase, x, y);

        // rastro de 3 linhas (muito cheio)
        ctx.fillStyle = gradient;
        ctx.shadowBlur = 15;
        ctx.shadowColor = "#00ffff";
        for (let trail = 1; trail <= 3; trail++) {
          if (drops[i] > trail) {
            ctx.globalAlpha = 1 - trail * 0.25;
            ctx.fillText(phrase, x, y - trail * fontSize * 1.5);
          }
        }
        ctx.globalAlpha = 1;

        drops[i] += 1.1;  // velocidade alta

        if (y > height + 100) {
          drops[i] = -Math.random() * 80;
        }
      }
      requestAnimationFrame(draw);
    }

    requestAnimationFrame(draw);

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      columns = Math.floor(width / columnSpacing) + 5;
      drops = Array(columns).fill(0);
      for (let i = 0; i < drops.length; i++) {
        drops[i] = Math.random() * -200;
      }
    });

    // clique = TE AMO grande subindo (sem coração)
    document.addEventListener('click', (e) => {
      const text = document.createElement('div');
      text.className = 'floating-text';
      text.innerText = 'TE AMO';
      text.style.left = e.clientX + 'px';
      text.style.top = e.clientY + 'px';
      document.body.appendChild(text);
      setTimeout(() => text.remove(), 3200);
    });
  </script>
</body>
</html>
