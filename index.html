<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Chuva de TE AMO ♡</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      font-family: 'Segoe UI', Tahoma, sans-serif;
    }
    canvas { display: block; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    // Ajusta o tamanho do canvas
    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    const phrase = "TE AMO ";
    const fontSize = 26;                           // maior e mais legível
    const columns = Math.floor(canvas.width / fontSize);
    const drops = Array(columns).fill(1);

    // Velocidade super lenta e suave
    let lastTime = 0;
    const speed = 180; // milissegundos entre cada passo (quanto maior = mais lento)

    function draw(timestamp) {
      if (!lastTime) lastTime = timestamp;
      if (timestamp - lastTime < speed) {
        requestAnimationFrame(draw);
        return;
      }
      lastTime = timestamp;

      // Fundo com rastro bem suave (fica clean)
      ctx.fillStyle = "rgba(0, 0, 0, 0.04)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Cor azul neon linda
      ctx.fillStyle = "#00ddff";
      ctx.font = `bold ${fontSize}px 'Segoe UI', Arial`;
      ctx.shadowBlur = 12;
      ctx.shadowColor = "#00ddff";

      for (let i = 0; i < drops.length; i++) {
        const x = i * fontSize;
        const y = drops[i] * fontSize;

        // Texto principal
        ctx.fillText(phrase, x, y);

        // Brilho branco na "cabeça" da coluna (efeito Matrix bonito)
        if (drops[i] > 1) {
          ctx.fillStyle = "#ffffff";
          ctx.fillText(phrase, x, y - fontSize);
        }

        // Reseta a coluna quando sai da tela
        if (y > canvas.height && Math.random() > 0.98) {
          drops[i] = 0;
        }

        drops[i] += 0.6; // velocidade da queda (fracionário = mais suave)
      }

      // Cor volta pro azul padrão pro próximo frame
      ctx.fillStyle = "#00ddff";
      ctx.shadowColor = "#00ddff";

      requestAnimationFrame(draw);
    }

    requestAnimationFrame(draw);
  </script>
</body>
</html>
